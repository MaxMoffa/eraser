name: Publish image (fork only)

# Lives only on the fork's `nas` branch, never in the upstream PR. Builds the
# Docker image and pushes it to ghcr.io/<owner>/eraser so a NAS can
# `docker compose pull` it instead of compiling Go itself. The image holds
# code only: config, passwords and history stay in the NAS volume.

on:
  push:
    branches: [nas]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Version
        id: v
        run: echo "version=$(git describe --tags --always)-nas" >>"$GITHUB_OUTPUT"

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eraser" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TrueNAS SCALE is x86_64 only, so a single amd64 image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
